name: Lua checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check every Lua file compiles
        run: |
          set -e
          for f in $(git ls-files '*.lua'); do
            luajit -bl "$f" > /dev/null
            echo "OK $f"
          done
      - name: Run the harnesses
        run: |
          set -e
          luajit tests/test_tint.lua colourtemp.koplugin
          luajit tests/test_main.lua colourtemp.koplugin android
          luajit tests/test_main.lua colourtemp.koplugin desktop
          luajit tests/test_main.lua colourtemp.koplugin eink
      - name: Version in _meta.lua matches the tag (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          meta=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' colourtemp.koplugin/_meta.lua)
          test "$tag" = "$meta" || { echo "tag v$tag != _meta.lua version $meta"; exit 1; }
